<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店铺宣传页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c0442c'/%3E%3Cpath d='M10 8v16M16 8v16M22 8v16M8 12h16' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#faf7f2;--card:#ffffff;--ink:#2b2622;--ink-dim:#8a8178;
    --brand:#c0442c;--gold:#b8862f;--line:rgba(43,38,34,.09);
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.65;-webkit-font-smoothing:antialiased;}
  img{display:block;max-width:100%;}
  .wrap{max-width:960px;margin:0 auto;background:var(--card);box-shadow:0 0 40px rgba(43,38,34,.06);}
  .hero{position:relative;min-height:300px;display:flex;align-items:flex-end;overflow:hidden;}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,10,.05) 30%,rgba(20,14,10,.78) 100%);}
  .hero-inner{position:relative;z-index:2;padding:28px 22px 26px;color:#fff;width:100%;}
  .hero .tag{display:inline-block;font-size:12.5px;letter-spacing:1px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:4px 11px;border-radius:20px;margin-bottom:12px;}
  .hero h1{margin:0;font-size:30px;line-height:1.2;font-weight:800;}
  .hero p{margin:8px 0 0;font-size:14.5px;color:rgba(255,255,255,.9);}
  section{padding:30px 22px;}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .sec-head svg{flex:none;}
  .sec-head h2{margin:0;font-size:20px;font-weight:800;}
  .sec-head .rule{flex:1;height:1px;background:var(--line);}
  .promo{border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;background:linear-gradient(135deg,#fff8f0,#fff);}
  .promo .badge{display:inline-block;background:var(--brand);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px;margin-bottom:10px;}
  .promo h3{margin:0 0 6px;font-size:17px;}
  .promo p{margin:0;font-size:14px;color:var(--ink-dim);}
  .promo .valid{margin-top:10px;font-size:12.5px;color:var(--gold);font-weight:600;}
  .dishes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .dish{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;}
  .dish .ph{position:relative;aspect-ratio:1/1;}
  .dish .ph img{width:100%;height:100%;object-fit:cover;}
  .dish .info{padding:11px 12px 13px;}
  .dish h4{margin:0 0 3px;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dish .desc{margin:0;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dish .price{margin-top:7px;font-size:16px;font-weight:800;color:var(--brand);}
  .dish .price small{font-size:11px;font-weight:400;color:var(--ink-dim);}
  .info-list{display:grid;gap:14px;}
  .info-item{display:flex;gap:12px;align-items:flex-start;}
  .info-item svg{flex:none;margin-top:2px;}
  .info-item .k{font-size:13px;color:var(--ink-dim);margin-bottom:2px;}
  .info-item .v{font-size:15px;word-break:break-all;}
  .info-item a{color:var(--brand);text-decoration:none;font-weight:600;}
  .qr-box{border:1px solid var(--line);border-radius:16px;padding:24px 18px;text-align:center;background:linear-gradient(180deg,#fff,#fcfaf6);}
  #qrcode{display:inline-block;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;}
  #qrcode img,#qrcode canvas{border-radius:6px;}
  .qr-tip{margin:14px 0 4px;font-size:14px;font-weight:700;}
  .qr-sub{font-size:12.5px;color:var(--ink-dim);margin:0 0 16px;}
  .qr-url{width:100%;max-width:340px;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:0 auto 14px;display:block;}
  .qr-url:focus{outline:2px solid var(--brand);border-color:var(--brand);}
  .btn{display:inline-flex;align-items:center;gap:7px;border:none;background:var(--brand);color:#fff;font-size:14px;font-weight:600;padding:11px 20px;border-radius:9px;cursor:pointer;text-decoration:none;}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  footer{padding:24px 22px 30px;text-align:center;font-size:12px;color:var(--ink-dim);border-top:1px solid var(--line);}
  @media (min-width:768px){
    .hero{min-height:420px;}.hero h1{font-size:40px;}
    section{padding:40px;}
    .dishes{grid-template-columns:repeat(4,1fr);gap:18px;}
    .info-list{grid-template-columns:repeat(3,1fr);gap:20px;}
    .hero-inner{padding:40px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <img id="heroImg" src="" alt="店铺环境">
    <div class="hero-inner">
      <span class="tag" id="brandBadge"></span>
      <h1 id="brandName"></h1>
      <p id="brandSlogan"></p>
    </div>
  </header>

  <section aria-label="最新活动">
    <div class="sec-head"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 7v14M12 7c-2.5 0-4-1.5-4-3s1.5 0 4 3zm0 0c2.5 0 4-1.5 4-3s-1.5 0-4 3z" stroke="#c0442c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><h2>最新活动</h2><span class="rule"></span></div>
    <div id="promos"></div>
  </section>

  <section aria-label="招牌菜品" style="background:#fcfaf6;">
    <div class="sec-head"><svg width="22" height="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h16v6H4zM4 10v10h16V10M8 14h8" stroke="#c0442c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><h2>招牌菜品</h2><span class="rule"></span></div>
    <div class="dishes" id="dishes"></div>
  </section>

  <section aria-label="门店信息">
    <div class="sec-head"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z" stroke="#c0442c" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="9" r="2.5" stroke="#c0442c" stroke-width="1.8"/></svg><h2>门店信息</h2><span class="rule"></span></div>
    <div class="info-list">
      <div class="info-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z" stroke="#c0442c" stroke-width="1.8"/><circle cx="12" cy="9" r="2.5" stroke="#c0442c" stroke-width="1.8"/></svg><div><div class="k">门店地址</div><div class="v" id="storeAddress"></div></div></div>
      <div class="info-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z" stroke="#c0442c" stroke-width="1.8" stroke-linejoin="round"/></svg><div><div class="k">联系电话</div><div class="v"><a id="storePhone" href="#"></a></div></div></div>
      <div class="info-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="#c0442c" stroke-width="1.8"/><path d="M12 7v5l3 2" stroke="#c0442c" stroke-width="1.8" stroke-linecap="round"/></svg><div><div class="k">营业时间</div><div class="v" id="storeHours"></div></div></div>
    </div>
  </section>

  <section aria-label="二维码" style="background:#fcfaf6;">
    <div class="sec-head"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1" stroke="#c0442c" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="#c0442c" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="#c0442c" stroke-width="1.8"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20v1" stroke="#c0442c" stroke-width="1.8" stroke-linecap="round"/></svg><h2>扫码访问</h2><span class="rule"></span></div>
    <div class="qr-box">
      <div id="qrcode"><span style="font-size:13px;color:#b8862f">二维码加载中…</span></div>
      <p class="qr-tip">手机长按 / 电脑右键二维码即可保存图片</p>
      <p class="qr-sub">打印张贴或转发，顾客扫码即可打开本页</p>
      <input class="qr-url" id="qrUrl" type="text" inputmode="url" aria-label="二维码指向链接">
      <a class="btn" id="qrDownload" href="#" download="店铺二维码.png"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>下载二维码</a>
    </div>
  </section>

  <footer id="footer"></footer>
</div>

<script src="data.js"></script>
<script src="https://fastly.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>
<script>
(function(){
  function el(id){return document.getElementById(id);}
  var d = SITE_DATA;
  document.title = d.brand.name + " · 最新活动与招牌菜品";

  el("heroImg").src = d.brand.heroImage;
  el("brandBadge").textContent = d.brand.badge;
  el("brandName").textContent = d.brand.name;
  el("brandSlogan").textContent = d.brand.slogan;

  var ph = el("promos");
  d.promos.forEach(function(p){
    var div = document.createElement("div");
    div.className = "promo";
    div.innerHTML = '<span class="badge"></span><h3></h3><p></p><div class="valid"></div>';
    div.querySelector(".badge").textContent = p.badge;
    div.querySelector("h3").textContent = p.title;
    div.querySelector("p").textContent = p.desc;
    div.querySelector(".valid").textContent = p.valid;
    ph.appendChild(div);
  });

  var dw = el("dishes");
  d.dishes.forEach(function(it){
    var art = document.createElement("article");
    art.className = "dish";
    var priceHtml = it.price === "时价" ? '时价' : ('¥'+it.price+' <small>/'+it.unit+'</small>');
    art.innerHTML = '<div class="ph"><img alt=""></div><div class="info"><h4></h4><p class="desc"></p><div class="price">'+priceHtml+'</div></div>';
    art.querySelector("img").src = it.image;
    art.querySelector("img").alt = it.name;
    art.querySelector("h4").textContent = it.name;
    art.querySelector(".desc").textContent = it.desc;
    dw.appendChild(art);
  });

  el("storeAddress").textContent = d.store.address;
  el("storePhone").textContent = d.store.phone;
  el("storePhone").href = "tel:" + d.store.phone.replace(/[^0-9+]/g,"");
  el("storeHours").textContent = d.store.hours;
  el("footer").textContent = d.footer;

  // 二维码
  var box = el("qrcode"), input = el("qrUrl"), dl = el("qrDownload");
  var current = window.location.href;
  input.value = current;
  function makeQR(text){
    box.innerHTML = "";
    if(typeof QRCode === "undefined"){box.innerHTML='<span style="font-size:13px;color:#b8862f">二维码库未加载</span>';return null;}
    new QRCode(box,{width:200,height:200,correctLevel:QRCode.CorrectLevel.M,text:text});
    return box.querySelector("img");
  }
  function refresh(){var img=makeQR(input.value.trim()||current);if(img)dl.href=img.src;}
  input.addEventListener("input",function(){clearTimeout(input._t);input._t=setTimeout(refresh,350);});
  dl.addEventListener("click",function(){var img=box.querySelector("img");if(img)dl.href=img.src;});
  refresh();
})();
</script>
</body>
</html>
